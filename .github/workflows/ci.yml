name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build all modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 (Corretto) with Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      # P0: build only. Tests are enabled from phase P3 (Testcontainers).
      - name: Build and package
        run: mvn -B -DskipTests verify

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: discovery-service,    port: 8761 }
          - { service: api-gateway,          port: 8080 }
          - { service: user-account-service, port: 8081 }
          - { service: transaction-service,  port: 8082 }
          - { service: notification-service, port: 8083 }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Validation only (no push). Image publishing arrives in phase P8.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}
