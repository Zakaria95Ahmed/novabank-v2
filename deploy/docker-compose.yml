# NovaBank v2: base compose file.
# SEC-03: ONLY the API gateway publishes a port to the host. Everything else is reachable
# only inside the "novabank-net" network. For local development use the dev override:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d postgres kafka
# Variables come from deploy/.env (copy deploy/.env.example).
name: novabank-v2

# ---------------------------------------------------------------
# Reusable blocks (YAML anchors)
# ---------------------------------------------------------------
x-spring-service: &spring-service
  env_file: .env
  networks:
    - novabank-net

x-eureka-env: &eureka-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/

x-eureka-kafka-env: &eureka-kafka-env
  <<: *eureka-env
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092

x-needs-infra: &needs-infra
  discovery-service:
    condition: service_healthy
  kafka:
    condition: service_started
  postgres:
    condition: service_healthy

services:
  # ---------------------------------------------------------------
  # Infrastructure (no published ports; see docker-compose.dev.yml)
  # ---------------------------------------------------------------
  postgres:
    image: postgres:17
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novabank-net

  kafka:
    image: apache/kafka:latest   # TODO (P8): pin an exact tag
    expose:
      - "19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - novabank-net

  # ---------------------------------------------------------------
  # Microservices (all built from the single root Dockerfile)
  # ---------------------------------------------------------------
  discovery-service:
    build:
      context: ..
      args:
        SERVICE: discovery-service
        PORT: 8761
    expose:
      - "8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - novabank-net

  api-gateway:
    <<: *spring-service
    build:
      context: ..
      args:
        SERVICE: api-gateway
        PORT: 8080
    ports:
      - "8080:8080"   # the ONLY published port
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      <<: *eureka-env

  user-account-service:
    <<: *spring-service
    build:
      context: ..
      args:
        SERVICE: user-account-service
        PORT: 8081
    expose:
      - "8081"
    depends_on: *needs-infra
    environment:
      <<: *eureka-kafka-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nova_bank_account_db

  transaction-service:
    <<: *spring-service
    build:
      context: ..
      args:
        SERVICE: transaction-service
        PORT: 8082
    expose:
      - "8082"
    depends_on: *needs-infra
    environment:
      <<: *eureka-kafka-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nova_bank_transaction_db

  notification-service:
    <<: *spring-service
    build:
      context: ..
      args:
        SERVICE: notification-service
        PORT: 8083
    expose:
      - "8083"
    depends_on: *needs-infra
    environment:
      <<: *eureka-kafka-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nova_bank_notification_db

networks:
  novabank-net:
    driver: bridge

volumes:
  postgres-data:
